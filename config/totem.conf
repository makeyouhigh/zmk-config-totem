CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_MOUSE=y
# 1. 전원 관리 (절전 모드)
#CONFIG_ZMK_SLEEP=y
# 1시간 후 깊은 절전 모드 진입 (3,600,000ms)
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 2. 마우스 기능 활성화 (대현님께 지금 가장 필요한 설정)
CONFIG_ZMK_MOUSE=y

# 3. 입력 안정화 (디바운스 설정)
# 토템 같은 직결 방식 키보드에서 너무 낮으면 중복 입력이 생길 수 있으나,
# 대현님의 설정값은 반응 속도를 극대화한 세팅입니다.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=2

# 4. 연결 안정성 및 호환성
# NKRO는 게임용이 아니라면 n(끄기)으로 두는 것이 블루투스 호환성에 더 유리합니다.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# 5. 블루투스 출력 강화 (연결이 자주 끊긴다면 추가 권장)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# https://github.com/kot149/zmk-battery-center
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_DONGLE_SCREEN_HORIZONTAL=y
CONFIG_DONGLE_SCREEN_FLIPPED=n
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=3000
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=90
CONFIG_DONGLE_SCREEN_MIN_BRIGHTNESS=10
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=70
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=y
CONFIG_DONGLE_SCREEN_BRIGHTNESS_UP_KEYCODE=115
CONFIG_DONGLE_SCREEN_BRIGHTNESS_DOWN_KEYCODE=114
CONFIG_DONGLE_SCREEN_BRIGHTNESS_STEP=5
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=n

CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2048

