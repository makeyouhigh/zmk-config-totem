CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_MOUSE=y

# dongle 브랜치의 키 입력/마우스/송신 설정을 유지합니다.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=2
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# AC Minimize (0x0206) needs the 16-bit Consumer HID report.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
