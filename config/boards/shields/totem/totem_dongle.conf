CONFIG_ZMK_SLEEP=n
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=0
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=2
CONFIG_DONGLE_SCREEN_BRIGHTNESS_MODIFIER=0
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=20
CONFIG_DONGLE_SCREEN_BRIGHTNESS_STEP=5

# BLE central 동작
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# 동글: BLE central 모드 안정화 설정
CONFIG_BT=y
CONFIG_BT_MAX_CONN=6

CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_CLIENT=y         
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y

# ZMK 디스플레이 기능 활성화
# CONFIG_ZMK_DISPLAY=y

# (선택) 동글 화면이 바로 꺼지지 않도록 유휴 시간 조정
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

